[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-world"
version = "0.2.0"
description = "Deterministic simulation core for AI-led emergent civilizations"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.11,<2"]
openai = ["openai>=3.22,<4"]
local = ["httpx>=0.28,<1"]
observer = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "anthropic>=1.11,<2",
  "openai>=3.22,<4",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
sovereign-world = "sovereign_world.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers --basetemp=work/pytest-temp"
markers = [
  "soak: long-running deterministic seed matrix",
  "live: calls a real model provider; needs its key, skipped unless selected",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sovereign_world"]
